apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'stickers.app.cuppystickerapp'
    //the compression of webp file during build causes problem with FileDescriptor in ContentProvider.
    aaptOptions {
        noCompress "webp"
    }
    signingConfigs {
        signing_config {
            keyAlias 'key1'
            keyPassword 'juanka'
            storeFile file('C:\\Users\\Juanka\\Desktop\\Seguridad\\Certificados_APPS\\keystore.jks')
            storePassword 'juanka'
        }
    }
    compileSdkVersion 35
    defaultConfig {
        applicationId "stickers.wp.cuppypackstickers"
        minSdkVersion 31
        targetSdkVersion 34
        versionCode 28
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def contentProviderAuthority = applicationId + ".stickerscuppy"
        // Creates a placeholder property to use in the manifest.
        manifestPlaceholders =
                [contentProviderAuthority: contentProviderAuthority]
        // Adds a new field for the authority to the BuildConfig class.
        buildConfigField("String",
                "CONTENT_PROVIDER_AUTHORITY",
                "\"${contentProviderAuthority}\"")
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.signing_config
        }
    }
    buildToolsVersion '28.0.3'
}



dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.facebook.fresco:fresco:3.7.0'
    implementation 'com.facebook.fresco:webpsupport:3.7.0'
    implementation 'com.facebook.fresco:animated-webp:3.7.0'
    implementation 'com.facebook.fresco:animated-base:3.7.0'
    implementation 'com.google.firebase:firebase-ads:23.6.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'

}
